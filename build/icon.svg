<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon: the header logo (gold tile + three claw marks). Render with `npm run icon`. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DFA6"/>
      <stop offset="0.55" stop-color="#D6B574"/>
      <stop offset="1" stop-color="#A9843F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DA" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFF6DA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#gold)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#shine)"/>
  <rect x="56" y="56" width="912" height="912" rx="198" fill="none" stroke="#1A1206" stroke-opacity="0.25" stroke-width="8"/>
  <g stroke="#1A1206" stroke-width="84" stroke-linecap="round" fill="none">
    <path d="M246 778L512 208"/>
    <path d="M398 816L664 284"/>
    <path d="M550 816L778 398"/>
  </g>
